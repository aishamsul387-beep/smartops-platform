name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧠 Typecheck
        run: npm run typecheck

      - name: 🏗️ Build
        run: npm run build

      - name: 🔎 Lint
        run: npm run lint --if-present

      - name: 🧪 Test
        run: npm run test --if-present